plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pvz.bmexhard'
    compileSdk 34

    defaultConfig {
        applicationId "com.pvz.bmexhard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
